<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Needle — Model Gallery</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d1a16; overflow: hidden; font-family: system-ui, sans-serif; }
    #view { position: fixed; inset: 0; }
    .label {
      position: absolute; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap;
      font: 700 12px/1.2 system-ui, sans-serif; color: #f2c14e; background: rgba(29, 26, 22, 0.82);
      padding: 3px 7px; border-radius: 6px; border: 1px solid rgba(242, 193, 78, 0.35);
    }
    .label small { display: block; color: #cfc6b5; font-weight: 500; font-size: 10px; }
    #hud { position: fixed; left: 10px; bottom: 10px; color: #cfc6b5; font: 12px system-ui, sans-serif; background: rgba(29,26,22,.8); padding: 6px 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="hud"></div>
  <script type="module" src="./gallery.ts"></script>
</body>
</html>
