<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Needle · Market QA</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14110d; }
      #game, #ui { position: fixed; inset: 0; }
      #ui { pointer-events: none; }
      #qa-toolbar { position: fixed; right: 12px; bottom: 12px; z-index: 1000; width: min(400px, calc(100vw - 24px)); padding: 12px; box-sizing: border-box; border: 1px solid #a38a58; border-radius: 8px; background: #191813ed; color: #f8efdb; font: 12px/1.4 system-ui, sans-serif; }
      #qa-toolbar[hidden] { display: none; }
      #qa-toolbar strong { font-size: 14px; }
      #qa-toolbar p { margin: 5px 0 9px; }
      #qa-toolbar .qa-buttons { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0; }
      #qa-toolbar button { cursor: pointer; color: #f8efdb; background: #393525; border: 1px solid #847856; border-radius: 4px; padding: 6px 8px; font: inherit; }
      #qa-toolbar button:hover { background: #58503a; }
      #qa-toolbar button:focus-visible { outline: 2px solid #ffc85a; outline-offset: 2px; }
      #qa-toolbar output { display: block; white-space: pre-wrap; font: 11px/1.5 ui-monospace, monospace; }
      #qa-status { margin-top: 8px; color: #ffd681; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <aside id="qa-toolbar" aria-label="Market QA controls">
      <strong>Market QA · development only</strong>
      <p>Memory storage · analytics disabled · F8 restores this toolbar.</p>
      <div class="qa-buttons" aria-label="Viewpoints">
        <button id="qa-seller">Seller view</button>
        <button id="qa-supply">Supply view</button>
        <button id="qa-overview">Overview</button>
        <button id="qa-spawn">Spawn view</button>
        <button id="qa-seller-photo">Seller photo</button>
        <button id="qa-supply-close">Supply close</button>
      </div>
      <div class="qa-buttons" aria-label="Interaction fixtures">
        <button id="qa-carry">Prepare hay → press E</button>
        <button id="qa-shovel">Prepare shovel → press E</button>
        <button id="qa-flood">Flood intake · 96 loads</button>
        <button id="qa-late">Load late fixture</button>
        <button id="qa-fresh">Fresh run</button>
      </div>
      <div class="qa-buttons" aria-label="Playback">
        <button id="qa-play">Play</button>
        <button id="qa-pause">Pause</button>
        <button id="qa-hide">Hide QA toolbar</button>
      </div>
      <output id="qa-metrics" aria-label="Live game metrics">Starting…</output>
      <output id="qa-status" aria-live="polite">Loading isolated game…</output>
    </aside>
    <script type="module" src="/tools/market-qa.ts"></script>
  </body>
</html>
